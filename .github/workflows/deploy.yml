name: Deploy to itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Install dependencies
        run: haxelib install heaps --always

      - name: Build
        run: |
          mkdir -p build
          haxe build.hxml
          cp index.html build/

      - name: Setup butler
        uses: remarkablegames/setup-butler@v2

      - name: Deploy to itch.io
        run: butler push build widgethiro/supercritical:html5
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
